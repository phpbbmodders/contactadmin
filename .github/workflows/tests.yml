name: Tests

env:
    EXTNAME: phpbbmodders/contactadmin # Your extension vendor/package name
    SNIFF: 1            # Run code sniffer on your code? 1 or 0
    IMAGE_ICC: 1        # Run icc profile sniffer on your images? 1 or 0
    EXECUTABLE_FILES: 1 # Run check for executable files? 1 or 0

on:
    push:
        branches:        # Run tests when commits are pushed to these branches in your repo
            - master
            - develop
    pull_request:        # Run tests when pull requests are made on these branches in your repo
        branches:
            - master
            - develop

jobs:
    # START Basic Checks Job (code sniffer, images check, etc.)
    basic-checks:
        runs-on: ubuntu-latest
        strategy:
            matrix:
               # php-versions: ['8.1']
                include:
                    # phpBB 3.3 with the extension's minimum PHP
                    - php: '7.4'
                      db: 'none'
                      NOTESTS: 1
                      phpbb: '3.3.x'
                    # phpBB 4.0 (the master branch) with its minimum PHP
                    - php: '8.2'
                      db: 'none'
                      NOTESTS: 1
                      phpbb: 'master'

        name: PHP ${{ matrix.php }} - ${{ matrix.db }}${{ matrix.phpbb == 'master' && ' - phpBB 4.0' || '' }}

        steps:
            - name: Update apt package index
              run: sudo apt update

            - name: Checkout phpBB
              uses: actions/checkout@v4
              with:
                  repository: phpbb/phpbb
                  ref: ${{ matrix.phpbb }}
                  path: phpBB3

            - name: Checkout extension
              uses: actions/checkout@v3
              with:
                  path: phpBB3/phpBB/ext/${{ env.EXTNAME }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysqli, sqlite, pdo_sqlite, intl, gd, exif, iconv, sqlsrv, pdo_sqlsrv, ldap
                  coverage: none

            - name: Setup environment for phpBB
              env:
                  DB: ${{ matrix.db }}
                  PHP_VERSION: ${{ matrix.php }}
                  NOTESTS: '1'
              run: .github/setup-phpbb.sh $DB $PHP_VERSION $NOTESTS
              working-directory: ./phpBB3

            - name: Run code sniffer
              if: ${{ env.SNIFF != 0 }}
              env:
                  NOTESTS: '1'
              run: .github/ext-sniff.sh $EXTNAME $NOTESTS
              working-directory: ./phpBB3

            - name: Check image ICC profiles
              if: ${{ env.IMAGE_ICC != 0 }}
              run: .github/check-image-icc-profiles.sh
              working-directory: ./phpBB3

            - name: Check executable files
              if: ${{ env.EXECUTABLE_FILES != 0 }}
              run: .github/ext-check-executable-files.sh ./ $EXTNAME
              working-directory: ./phpBB3
    # END Basic Checks Job

    # EPV (Extension Pre Validator), failing on any Fatal or Error finding not
    # listed in .github/epv-allowed.txt
    epv:
        uses: phpbbmodders/.github/.github/workflows/epv.yml@v1
        with:
            EXTNAME: phpbbmodders/contactadmin
            PHPBB_BRANCHES: '["3.3.x", "master"]'
